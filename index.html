<style>
:root {
  --pink:#ff4d8d;
  --rose:#c9356e;
  --text:#5a2340;
  --glass:rgba(255,255,255,.65);
  --shadow:0 20px 50px rgba(255,77,141,.25);
}
* {box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body {
  font-family:Poppins,'Hind Siliguri',sans-serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  background:linear-gradient(135deg,#ffe3ee,#ffd1e3,#ffeaf3,#fff5f9);
  background-size:300% 300%;
  animation:bg 14s ease infinite;
}
body.bn {font-family:'Hind Siliguri',sans-serif}
@keyframes bg {0%,100%{background-position:0 50%}50%{background-position:100% 50%}}

#bg-layer,#fx-layer {position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bg-layer {z-index:0}
#fx-layer {z-index:90}
.float {position:absolute;bottom:-60px;opacity:.7;animation:rise linear infinite}
@keyframes rise {to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.fall {position:absolute;top:-50px;animation:fall linear forwards}
@keyframes fall {to{transform:translateY(112vh) rotate(360deg)}}

#topbar {position:fixed;top:12px;right:12px;z-index:100;display:flex;gap:8px}
.pill {border:none;cursor:pointer;background:white;color:var(--rose);font:600 .85rem Poppins;padding:9px 15px;border-radius:999px;box-shadow:0 4px 12px #0001}
#music {display:none}
#dots {position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px}
#dots i {width:10px;height:10px;border-radius:50%;background:white;opacity:.6}
#dots i.on {background:var(--pink);opacity:1;transform:scale(1.35)}

main {position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:65px 16px 30px}
.page {display:none;width:100%;max-width:560px;text-align:center}
.page.active {display:block;animation:pop .6s ease}
@keyframes pop {from{opacity:0;transform:translateY(25px) scale(.95)}to{opacity:1;transform:none}}
.card {background:var(--glass);backdrop-filter:blur(18px);border:1.5px solid white;border-radius:30px;padding:30px 22px;box-shadow:var(--shadow)}
h1,h2 {font-family:'Dancing Script','Hind Siliguri',cursive;color:var(--rose);line-height:1.25}
h1 {font-size:clamp(2.2rem,8vw,3.2rem)}
h2 {font-size:clamp(1.8rem,7vw,2.5rem)}
body.bn h1,body.bn h2 {font-family:'Hind Siliguri';font-weight:600}
.sub {font-weight:300;margin:12px 0 20px}
.big {font-size:1.3rem;font-weight:500;margin:15px 0 25px}
.hero-heart {font-size:4rem;animation:beat 1.2s infinite;display:inline-block}
@keyframes beat {0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}

.btn {border:0;cursor:pointer;font-family:inherit;font-weight:600;border-radius:999px;padding:13px 28px;font-size:1rem;transition:.2s}
.btn-yes,.btn-next {background:linear-gradient(135deg,var(--pink),#ff7aa8);color:white;box-shadow:0 10px 25px #ff4d8d66}
.btn-yes {font-size:1.3rem;padding:16px 40px;animation:beat 1.6s infinite;z-index:5}
.btn-no {background:white;color:#8a5a70;box-shadow:0 6px 16px #0002;white-space:nowrap}
.btn-back,.btn-ghost {background:white;color:var(--rose)}
.btn-ghost {font-size:.9rem;padding:10px 18px;margin:5px}
.row,.nav {display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:70px}
.nav {margin-top:18px}
#noBtn.run {position:fixed}
.hint {font-size:.85rem;min-height:20px;opacity:.8}

label.t {display:block;text-align:left;font-weight:600;margin:16px 0 8px;color:var(--rose)}
input[type=date],input[type=time],textarea {width:100%;padding:13px;border-radius:16px;border:2px solid #ffc6dc;background:#ffffffed;font:inherit;color:var(--text)}
textarea {height:85px;resize:none}
.chips,.foods {display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chip,.food {padding:13px 8px;border-radius:17px;background:#ffffffed;border:2px solid #ffd3e3;cursor:pointer;font-weight:500;transition:.2s}
.chip.sel,.food.sel {background:linear-gradient(135deg,var(--pink),#ff7aa8);color:white;border-color:white}
.chips.three .chip:last-child:nth-child(odd) {grid-column:1/-1}
.meter {display:flex;gap:12px;align-items:center}
.meter input {flex:1;accent-color:var(--pink)}
.meter span {font-size:2rem}
.err {color:#d6204f;font-size:.88rem;min-height:22px;margin-top:10px}

.food {padding:15px 5px;position:relative}
.food .e {display:block;font-size:2rem}
.food.sel:after {content:"💖";position:absolute;top:-8px;right:-4px}
.summary {background:#ffffffc9;border-radius:22px;padding:18px;margin:18px 0;text-align:left;border:2px dashed #ff9fc2}
.summary h3 {font-family:'Dancing Script',cursive;font-size:1.8rem;text-align:center;color:var(--rose);margin-bottom:10px}
.summary p {margin:8px 0;overflow-wrap:anywhere}
#countdown {display:flex;gap:7px;justify-content:center;margin:15px 0}
#countdown div {background:white;border-radius:14px;padding:10px 6px;min-width:60px}
#countdown b {display:block;font-size:1.4rem;color:var(--pink)}
#countdown small {font-size:.7rem}
.msg {line-height:1.8;margin:16px 0;min-height:90px;font-style:italic}
body.bn .msg {font-style:normal}
.final {font-family:'Dancing Script',cursive;font-size:2rem;color:var(--rose)}
body.bn .final {font-family:'Hind Siliguri';font-size:1.5rem}
.status {font-size:.85rem;margin-top:12px;min-height:20px}
.wa {display:inline-block;margin-top:10px;text-decoration:none;background:#25d366;color:white;padding:11px 20px;border-radius:30px;font-weight:600}
#gallery {display:none;margin:15px auto;position:relative;width:200px;height:210px}
#gallery img {position:absolute;inset:0;width:100%;height:190px;object-fit:cover;border:8px solid white;box-shadow:0 10px 24px #0003;opacity:0;transition:.7s}
#gallery img.on {opacity:1;transform:rotate(3deg)}
@media(max-width:380px){.card{padding:25px 15px}.btn{padding:12px 20px}}
</style>
</head>

const FOODS=[
["🍕","Pizza"],["🍔","Burger"],["☕","Coffee"],
["🍝","Pasta"],["🍦","Ice Cream"],["🍰","Cake"],
["🍗","Fried Chicken"],["🍜","Noodles"],
["🧋","Bubble Tea"],["🍟","French Fries"]
];

const $=id=>document.getElementById(id);
const state={
date:"",time:"",exact:"",place:"",
foods:[],extra:"",excitement:7,noClicks:0
};

let lang=CONFIG.DEFAULT_LANG==="bn"?"bn":"en";
let current="p1",settled=false,audio=null,musicOn=false;
let cdTimer=null,typeTimer=null;

/* =============== LANGUAGE =============== */
function applyLang(){
 const L=T[lang];
 document.body.classList.toggle("bn",lang==="bn");
 document.documentElement.lang=lang;

 document.querySelectorAll("[data-i]").forEach(el=>{
   if(typeof L[el.dataset.i]==="string")
     el.textContent=L[el.dataset.i];
 });

 document.querySelectorAll("[data-iph]").forEach(el=>{
   el.placeholder=L[el.dataset.iph];
 });

 $("hey").textContent=CONFIG.HER_NAME?
   L.heyN(CONFIG.HER_NAME):L.hey;

 $("langBtn").textContent=L.langBtn;
 $("meterE").textContent=L.meter[state.excitement-1];

 document.querySelectorAll(".food").forEach((f,i)=>{
   f.querySelector(".t2").textContent=L.food[i];
 });

 $("from").textContent=CONFIG.YOUR_NAME?
   "— "+CONFIG.YOUR_NAME+" 💌":"";

 if(current==="p4"){
   fillSummary();
   $("typed").textContent=CONFIG.PERSONAL_NOTE||L.msg;
 }
}

$("langBtn").onclick=()=>{
 lang=lang==="en"?"bn":"en";
 applyLang();
};

/* =============== BACKGROUND =============== */
(function(){
 const items=["💗","🌸","✨","💕","🌷","💖","🌹"];
 for(let i=0;i<22;i++){
   const s=document.createElement("span");
   s.className="float";
   s.textContent=items[i%items.length];
   s.style.left=Math.random()*100+"vw";
   s.style.fontSize=(14+Math.random()*26)+"px";
   s.style.animationDuration=(9+Math.random()*12)+"s";
   s.style.animationDelay=(-Math.random()*18)+"s";
   $("bg-layer").appendChild(s);
 }
})();

function rain(em,count){
 for(let i=0;i<count;i++){
   setTimeout(()=>{
     const s=document.createElement("span");
     s.className="fall";
     s.textContent=em[Math.floor(Math.random()*em.length)];
     s.style.left=Math.random()*100+"vw";
     s.style.fontSize=(18+Math.random()*25)+"px";
     const d=3+Math.random()*3;
     s.style.animationDuration=d+"s";
     $("fx-layer").appendChild(s);
     setTimeout(()=>s.remove(),d*1000);
   },Math.random()*1800);
 }
}

function celebrate(){
 rain(["💖","💗","🌸","🌷","🌹","💕"],70);
}

/* =============== MUSIC =============== */
if(CONFIG.MUSIC_URL){
 audio=new Audio(CONFIG.MUSIC_URL);
 audio.loop=true;
 audio.volume=.6;
 $("music").style.display="inline-block";
}

function setMusic(on){
 if(!audio)return;
 musicOn=on;
 $("music").textContent=on?"🎵":"🔇";
 if(on)audio.play().catch(()=>{});
 else audio.pause();
}
$("music").onclick=()=>setMusic(!musicOn);

/* =============== NAVIGATION =============== */
function go(id){
 $(current).classList.remove("active");
 current=id;
 $(id).classList.add("active");
 document.querySelectorAll("#dots i").forEach((d,i)=>{
   d.classList.toggle("on",i===Number(id[1])-1);
 });
 window.scrollTo(0,0);
}

/* =============== NO BUTTON =============== */
const noBtn=$("noBtn"),yesBtn=$("yesBtn");

function decline(){
 $("btnRow").style.display="none";
 $("noHint").style.display="none";
 $("declineBox").style.display="block";
 $("declineBox").textContent=T[lang].decline;
}

function dodge(e){
 if(settled){
   if(e.type==="click")decline();
   return;
 }

 e.preventDefault();
 e.stopPropagation();
 state.noClicks++;

 if(state.noClicks>=CONFIG.NO_DODGES){
   settled=true;
   noBtn.classList.remove("run");
   noBtn.style.left="";
   noBtn.style.top="";
   noBtn.textContent=T[lang].noFinal;
   $("noHint").textContent="";
   yesBtn.style.transform="";
   return;
 }

 noBtn.textContent=T[lang].noT[
   state.noClicks%T[lang].noT.length
 ];
 noBtn.classList.add("run");

 $("noHint").textContent=lang==="bn"?
   "না বাটনটা মনে হয় লজ্জা পাচ্ছে... 😏":
   "The NO button seems shy... 😏";

 const vw=innerWidth,vh=innerHeight;
 const w=noBtn.offsetWidth,h=noBtn.offsetHeight;
 const pad=15;

 noBtn.style.left=pad+Math.random()*Math.max(1,vw-w-pad*2)+"px";
 noBtn.style.top=70+Math.random()*Math.max(1,vh-h-90)+"px";

 yesBtn.style.transform=
   "scale("+Math.min(1.6,1+state.noClicks*.06)+")";
}

["mouseenter","touchstart","pointerdown","click"].forEach(ev=>{
 noBtn.addEventListener(ev,dodge,{passive:false});
});

noBtn.addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" ")dodge(e);
});

/* =============== YES BUTTON =============== */
yesBtn.onclick=()=>{
 celebrate();
 noBtn.style.display="none";
 setMusic(true);
 setTimeout(()=>go("p2"),700);
};

/* =============== DATE SETTINGS =============== */
const di=$("dateInput");
const tomorrow=new Date();
tomorrow.setDate(tomorrow.getDate()+1);
di.min=tomorrow.toISOString().split("T")[0];

function chipGroup(id,key){
 $(id).addEventListener("click",e=>{
   const c=e.target.closest(".chip");
   if(!c)return;
   [...$(id).children].forEach(x=>x.classList.remove("sel"));
   c.classList.add("sel");
   state[key]=c.dataset.v;
 });
}

chipGroup("timeChips","time");
chipGroup("placeChips","place");

$("meter").oninput=e=>{
 state.excitement=Number(e.target.value);
 $("meterE").textContent=T[lang].meter[state.excitement-1];
};

$("back2").onclick=()=>go("p1");

$("next2").onclick=()=>{
 state.date=di.value;
 state.exact=$("exactTime").value;

 const L=T[lang];

 if(!state.date)return $("err2").textContent=L.errDate;
 if(!state.time&&!state.exact)return $("err2").textContent=L.errTime;
 if(!state.place)return $("err2").textContent=L.errPlace;

 $("err2").textContent="";
 go("p3");
};

/* =============== FOOD SELECTION =============== */
FOODS.forEach(([emoji,name],i)=>{
 const d=document.createElement("div");
 d.className="food";
 d.dataset.v=emoji+" "+name;
 d.innerHTML=`<span class="e">${emoji}</span><span class="t2"></span>`;
 d.querySelector(".t2").textContent=T[lang].food[i];

 d.onclick=()=>{
   d.classList.toggle("sel");
   state.foods=[...document.querySelectorAll(".food.sel")]
     .map(x=>x.dataset.v);
 };
 $("foods").appendChild(d);
});

$("back3").onclick=()=>go("p2");

$("next3").onclick=async()=>{
 if(!state.foods.length){
   $("err3").textContent=T[lang].errFood;
   return;
 }

 state.extra=$("extra").value.trim();
 $("err3").textContent="";

 fillSummary();
 go("p4");

 celebrate();
 typeMsg();
 startCountdown();
 buildGallery();

 await sendFinal();
};

/* =============== SUMMARY =============== */
function timeLabel(){
 const L=T[lang];
 const key={
  "Morning":"morning",
  "Afternoon":"afternoon",
  "Evening":"evening",
  "Night":"night"
 };
 const base=state.time?
   L[key[state.time.split(" ")[0]]]: "";
 return [base,state.exact].filter(Boolean).join(" · ");
}

function fillSummary(){
 const d=new Date(state.date+"T00:00:00");

 $("sDate").textContent=d.toLocaleDateString(
   lang==="bn"?"bn-BD":"en-US",
   {weekday:"long",year:"numeric",month:"long",day:"numeric"}
 );

 $("sTime").textContent=timeLabel();
 $("sPlace").textContent=state.place;
 $("sFood").textContent=state.foods.map(f=>{
   const i=FOODS.findIndex(x=>x[0]+" "+x[1]===f);
   return i>=0?FOODS[i][0]+" "+T[lang].food[i]:f;
 }).join(", ");

 $("sExtra").textContent=state.extra;
 $("sExtraWrap").style.display=state.extra?"block":"none";
}

/* =============== TYPING MESSAGE =============== */
function typeMsg(){
 clearInterval(typeTimer);
 const txt=CONFIG.PERSONAL_NOTE||T[lang].msg;
 const el=$("typed");
 el.textContent="";
 let i=0;

 typeTimer=setInterval(()=>{
   el.textContent=txt.slice(0,++i);
   if(i>=txt.length)clearInterval(typeTimer);
 },35);
}

/* =============== COUNTDOWN =============== */
function targetDate(){
 const d=new Date(state.date+"T00:00:00");

 if(state.exact){
   const [h,m]=state.exact.split(":");
   d.setHours(+h,+m);
 }else{
   const base=state.time;
   d.setHours(
     base.startsWith("Morning")?10:
     base.startsWith("Afternoon")?15:
     base.startsWith("Evening")?18:20,0
   );
 }
 return d;
}

function startCountdown(){
 clearInterval(cdTimer);
 const target=targetDate();

 function tick(){
   const seconds=Math.max(0,Math.floor(
     (target-new Date())/1000
   ));

   $("cD").textContent=Math.floor(seconds/86400);
   $("cH").textContent=Math.floor(seconds%86400/3600);
   $("cM").textContent=Math.floor(seconds%3600/60);
   $("cS").textContent=seconds%60;
 }
 tick();
 cdTimer=setInterval(tick,1000);
}

/* =============== PHOTO GALLERY =============== */
function buildGallery(){
 const g=$("gallery");
 if(!CONFIG.PHOTOS.length||g.children.length)return;

 g.style.display="block";

 CONFIG.PHOTOS.forEach((src,i)=>{
   const im=document.createElement("img");
   im.src=src;
   if(i===0)im.className="on";
   g.appendChild(im);
 });

 if(CONFIG.PHOTOS.length>1){
   let k=0;
   setInterval(()=>{
     const imgs=g.querySelectorAll("img");
     imgs[k].classList.remove("on");
     k=(k+1)%imgs.length;
     imgs[k].classList.add("on");
   },3000);
 }
}

/* =============== GOOGLE SHEETS =============== */
/*
Apps Script expected parameters:
date, time, place, food, message
*/

async function sendToGoogleSheet(){
 const data=new URLSearchParams();

 data.append("date",state.date);
 data.append("time",[state.time,state.exact].filter(Boolean).join(" · "));
 data.append("place",state.place);
 data.append("food",state.foods.join(", "));
 data.append("message",state.extra);

 try{
   await fetch(CONFIG.GOOGLE_SHEETS_URL,{
     method:"POST",
     mode:"no-cors",
     headers:{
       "Content-Type":"application/x-www-form-urlencoded"
     },
     body:data.toString()
   });

   return true;
 }catch(error){
   console.error("Google Sheets Error:",error);
   return false;
 }
}

/* =============== WHATSAPP =============== */
function report(){
 return `💖 DATE INVITATION RESPONSE

📅 Date: ${state.date}
⏰ Time: ${state.time} ${state.exact}
📍 Place: ${state.place}
🍕 Food: ${state.foods.join(", ")}
💗 Extra: ${state.extra||"-"}
💓 Excitement: ${state.excitement}/10
😂 NO attempts: ${state.noClicks}`;
}

/* =============== FINAL SUBMISSION =============== */
async function sendFinal(){
 const st=$("status");

 try{
   localStorage.setItem("dateAnswers",JSON.stringify(state));
 }catch(e){}

 st.textContent=lang==="bn"?
   "তোমার উত্তর জমা দেওয়া হচ্ছে... 💌":
   "Submitting your date plan... 💌";

 const result=await sendToGoogleSheet();

 /*
 no-cors cannot reveal the server's actual response.
 This message means the browser completed the request,
 not that Google Sheets confirmed the row was saved.
 */
 st.textContent=lang==="bn"?
   "অনুরোধ পাঠানো হয়েছে! Google Sheets চেক করো 💖":
   "Submission request sent! Please check Google Sheets 💖";

 if(CONFIG.WHATSAPP_NUMBER){
   const a=document.createElement("a");
   a.className="wa";
   a.target="_blank";
   a.rel="noopener";
   a.href="https://wa.me/"+CONFIG.WHATSAPP_NUMBER+
     "?text="+encodeURIComponent(report());
   a.textContent=T[lang].wa;
   $("waWrap").appendChild(a);
 }
}

/* =============== CALENDAR =============== */
$("calBtn").onclick=()=>{
 const start=targetDate();
 const end=new Date(start.getTime()+2*60*60*1000);

 const fmt=d=>
   d.getFullYear()+
   String(d.getMonth()+1).padStart(2,"0")+
   String(d.getDate()).padStart(2,"0")+"T"+
   String(d.getHours()).padStart(2,"0")+
   String(d.getMinutes()).padStart(2,"0")+"00";

 const ics=[
  "BEGIN:VCALENDAR",
  "VERSION:2.0",
  "PRODID:-//Our Date//EN",
  "BEGIN:VEVENT",
  "DTSTAMP:"+fmt(new Date()),
  "DTSTART:"+fmt(start),
  "DTEND:"+fmt(end),
  "SUMMARY:Our Date",
  "DESCRIPTION:Place: "+state.place,
  "END:VEVENT",
  "END:VCALENDAR"
 ].join("\r\n");

 const blob=new Blob([ics],{type:"text/calendar"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="our-date.ics";
 a.click();
 URL.revokeObjectURL(url);
};

$("againBtn").onclick=celebrate;

/* =============== INITIALIZE =============== */
applyLang();

</script>
